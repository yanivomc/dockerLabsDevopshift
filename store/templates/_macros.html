{% macro product_icon(category) %}
{% if category == 'laptops' %}
<svg viewBox="0 0 80 80" fill="none" class="w-16 h-16 text-white/95" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="20" width="52" height="32" rx="2" stroke="currentColor" stroke-width="2"/>
  <rect x="18" y="24" width="44" height="24" fill="currentColor" fill-opacity="0.18"/>
  <path d="M8 56h64l-4 6H12l-4-6z" fill="currentColor" fill-opacity="0.85"/>
  <line x1="34" y1="60" x2="46" y2="60" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
{% elif category == 'phones' %}
<svg viewBox="0 0 60 80" fill="none" class="w-12 h-16 text-white/95" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="8" width="32" height="64" rx="5" stroke="currentColor" stroke-width="2"/>
  <rect x="18" y="14" width="24" height="48" fill="currentColor" fill-opacity="0.18"/>
  <circle cx="30" cy="68" r="1.8" fill="currentColor"/>
  <rect x="26" y="11" width="8" height="1.5" rx="0.75" fill="currentColor" fill-opacity="0.6"/>
</svg>
{% else %}
<svg viewBox="0 0 80 80" fill="none" class="w-16 h-16 text-white/95" xmlns="http://www.w3.org/2000/svg">
  <path d="M16 46 Q16 18 40 18 Q64 18 64 46" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="10" y="44" width="14" height="22" rx="3" fill="currentColor" fill-opacity="0.9"/>
  <rect x="56" y="44" width="14" height="22" rx="3" fill="currentColor" fill-opacity="0.9"/>
</svg>
{% endif %}
{% endmacro %}
