<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevopShift Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
  <header class="border-b border-slate-700 bg-slate-950">
    <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">
          <span class="text-cyan-400">Devop</span><span class="text-white">Shift</span>
          <span class="text-slate-400 font-normal text-base ml-2">Store</span>
        </h1>
        <p class="text-xs text-slate-500 mt-1">A learning lab for the DevopShift Docker course</p>
      </div>
      <nav class="text-sm text-slate-400 space-x-4">
        <a href="/products" class="hover:text-cyan-400 transition">/products</a>
        <a href="/health" class="hover:text-cyan-400 transition">/health</a>
        <a href="/info" class="hover:text-cyan-400 transition">/info</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto px-6 py-10 w-full">
    <h2 class="text-xl font-semibold mb-6">Products</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      {% for p in products %}
      <article class="rounded-xl bg-slate-800 border border-slate-700 overflow-hidden hover:border-cyan-500 transition">
        <div class="h-32 {% if p.category == 'laptops' %}bg-gradient-to-br from-cyan-500 to-blue-700{% elif p.category == 'phones' %}bg-gradient-to-br from-fuchsia-500 to-purple-700{% else %}bg-gradient-to-br from-amber-500 to-rose-600{% endif %}"></div>
        <div class="p-5">
          <p class="text-xs uppercase tracking-wide text-slate-400">{{ p.category }}</p>
          <h3 class="text-lg font-medium mt-1">{{ p.name }}</h3>
          <p class="text-cyan-400 font-semibold mt-3">${{ p.price }}</p>
        </div>
      </article>
      {% endfor %}
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-950">
    <div class="max-w-6xl mx-auto px-6 py-4 text-xs text-slate-500 flex justify-between">
      <span>Container hostname: <code class="text-slate-300">{{ hostname }}</code></span>
      <span>v{{ version }}</span>
    </div>
  </footer>
</body>
</html>
